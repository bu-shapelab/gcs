[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gcs-shape"
version = "2.0.0"
description = "Generalized cylindrical shell library for Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Kelsey L. Snapp et al." },
]
maintainers = [
    { name = "Samuel Silverman", email = "sssilver@bu.edu" },
]
keywords = ["geometry", "mesh", "3d", "shell", "cylindrical"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "bentley-ottmann==7.3.0",
    "mapbox-earcut>=1.0.0",
    "numpy>=1.21.5",
    "numpy-stl>=2.17.1",
    "pandas>=1.4.1",
    "scipy>=1.7.3",
]

[project.urls]
Homepage = "https://github.com/samsilverman/gcs"
Issues = "https://github.com/samsilverman/gcs/issues"
Source = "https://github.com/samsilverman/gcs"

[project.optional-dependencies]
dev = [
    "autopep8==1.6.0",
    "build==0.7.0",
    "pylint==3.3.9",
    "pytest==7.1.2",
    "pytest-cov==4.1.0",
    "twine==6.0.1",
]

[tool.setuptools.packages.find]
exclude = ["tests*"]
